name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'

permissions:
  # write: create the GitHub Release with the downloadable zip
  contents: write

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Package, and Submit
    runs-on: ubuntu-latest
    environment: chrome-web-store

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Check
        run: npm run check

      - name: Package Extension
        id: package
        run: |
          # Zip the build from `npm run check` with the zip tool: `wxt zip` writes invalid entry dates
          # (1980-00-00), which some unzip tools complain about when users install by hand.
          VERSION=$(node -p "require('./package.json').version")
          ZIP_FILE=".output/chrome-slopster-$VERSION-chrome.zip"
          rm -f "$ZIP_FILE"
          (cd .output/chrome-mv3 && zip -qrX "../chrome-slopster-$VERSION-chrome.zip" .)
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: packaged zip $ZIP_FILE not found"
            exit 1
          fi
          MANIFEST_VERSION=$(unzip -p "$ZIP_FILE" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Error: manifest version $MANIFEST_VERSION does not match package version $VERSION"
            exit 1
          fi
          echo "zip_path=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # A draft first, published only after the Chrome Web Store upload succeeds, so GitHub never lists
      # a version that failed to reach the store. Re-running the workflow refreshes the zip and the notes.
      - name: Create draft GitHub Release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_FILE: ${{ steps.package.outputs.zip_path }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes: this version's CHANGELOG section, plus manual install steps.
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md for changes." > release-notes.md
          # Relative links in the changelog would resolve against the release page; point them at the tagged files.
          sed -E -i "s#\]\((\./)?([^)#:][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\2)#g" release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Install manually

          1. Download the `.zip` file below and unzip it into a folder you will keep.
          2. Open `chrome://extensions` in Chrome and turn on **Developer mode** (top right).
          3. Click **Load unpacked** and select the unzipped folder (the one that contains `manifest.json`).

          A manually installed copy does not update itself. See the README for details.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_FILE" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP_FILE" --draft --title "Slopster $GITHUB_REF_NAME" --notes-file release-notes.md
          fi

      - name: Upload & Submit for Review
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: ${{ steps.package.outputs.zip_path }}
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Retried, because a re-run cannot get here again: the store refuses the same version twice.
        # If it still fails, publish the draft by hand (see docs/PUBLISHING.md).
        run: |
          for attempt in 1 2 3; do
            gh release edit "$GITHUB_REF_NAME" --draft=false && exit 0
            sleep 15
          done
          exit 1
