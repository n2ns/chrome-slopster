name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Compile, lint, test, build, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # compile + lint + unit tests + build
      - name: Check
        run: npm run check

      - name: Package and inspect extension
        run: |
          # Same packaging as the publish workflow (zip tool, not `wxt zip`, for valid entry dates).
          VERSION=$(node -p "require('./package.json').version")
          (cd .output/chrome-mv3 && zip -qrX "../chrome-slopster-$VERSION-chrome.zip" .)
          unzip -t ".output/chrome-slopster-$VERSION-chrome.zip"
          unzip -l ".output/chrome-slopster-$VERSION-chrome.zip" | grep -q ' manifest.json$'
